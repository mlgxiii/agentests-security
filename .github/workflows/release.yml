# Publishes to npm with provenance when a version tag (v1.2.3) is pushed.
# Authentication: npm trusted publishing (OIDC), configured on npmjs.com for this
# repository, workflow release.yml, and environment npm. No npm token is stored.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance and trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: npm with trusted publishing support (11.5.1 or later)
        run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm test
      - name: Skip a version already on npm
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is already on npm; skipping the publish."
          fi
      - name: Publish
        if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public --ignore-scripts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
